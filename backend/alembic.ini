# =====================================================================
# Alembic configuration for GleamDream Studio
# NOTE: keep this file ASCII-only (alembic reads it with locale encoding).
# The real database URL is injected from app.core.config.settings
# (DATABASE_URL, asyncpg driver) inside alembic/env.py.
# =====================================================================

[alembic]
# migration scripts directory
script_location = alembic
# prepend CWD to sys.path so env.py can import the app package
prepend_sys_path = .
# placeholder only; overridden by env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
