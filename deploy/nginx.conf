# =============================================================================
# 浮光造梦 nginx 配置
#
# 职责：
#   1. 托管 Vue SPA 静态产物（history 路由回退 index.html）
#   2. /api/ 与 /files/ 反向代理到 backend:8000
#   3. SSE 事件流（项目/渲染/通知）关闭一切缓冲，保证逐条推送
# =============================================================================

upstream gleam_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 素材上传（剧本 PDF、角色照片等）
    client_max_body_size 200m;

    # 容器健康检查
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---------- API（含 SSE 流式接口） ----------
    # ^~ 前缀优先于下方静态资源正则，避免 .png 结尾的 API 路由被静态目录截获
    location ^~ /api/ {
        proxy_pass http://gleam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE：关闭缓冲与 gzip 攒包，长任务等待放宽到 10 分钟
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- 媒体文件（/files/{object_key}，图/视频/音频） ----------
    location ^~ /files/ {
        proxy_pass http://gleam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        expires 1d;
        add_header Cache-Control "public";
    }

    # ---------- 接口文档 ----------
    location = /openapi.json {
        proxy_pass http://gleam_backend;
        proxy_set_header Host $host;
    }

    location ^~ /docs {
        proxy_pass http://gleam_backend;
        proxy_set_header Host $host;
    }

    location ^~ /redoc {
        proxy_pass http://gleam_backend;
        proxy_set_header Host $host;
    }

    # ---------- index.html 不缓存（引用带 hash 的 chunk） ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ---------- 带 hash 的静态资源长缓存 ----------
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        add_header Cache-Control "public, immutable";
        expires 30d;
    }

    # ---------- SPA history 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
