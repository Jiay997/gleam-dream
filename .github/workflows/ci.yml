# 文件级注释：GleamDream Studio CI（前端类型/构建 + 后端迁移/测试）
# 说明：后端测试依赖 PostgreSQL 与 .env 配置；无外网环境通过 GD_SKIP_LLM_LIVE=1
# 跳过真实 LLM 用例。当前未引入 ESLint/ruff，避免新增与业务无关的依赖。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gleam-dream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gleam-dream
      JWT_SECRET: ci-only-secret-at-least-32-bytes-long
      ADMIN_TOKEN: ci-admin-token
      SANDBOX_MODE: "true"
      GD_SKIP_LLM_LIVE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Init database
        run: python scripts/init_db.py
      - name: Run tests (skip external LLM)
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
